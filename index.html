<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AB VISUALS — Professional Drone Services &amp; Wedding Cinematography</title>
<meta name="description" content="AB VISUALS — professional drone pilot, aerial cinematography &amp; wedding film studio. Weddings, pre-wedding, events, real estate and cinematic FPV across India.">
<meta property="og:title" content="AB VISUALS — Professional Drone Services &amp; Wedding Cinematography">
<meta property="og:description" content="AB VISUALS — professional drone pilot, aerial cinematography &amp; wedding film studio. Weddings, pre-wedding, events, real estate and cinematic FPV across India.">
<meta name="theme-color" content="#0b2f20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&family=Caveat+Brush&family=Anton&display=swap" rel="stylesheet">
<script type="module" src="/src/main.ts"></script>
<style>
/* ============ tokens & base ============ */
:root{
  --green-900:#0b2f20; --green-800:#11402c; --green-700:#1a5a40; --mint:#cfeee0; --ink:#0d0f0e;
  --n:1px; --glide:.8s;
}
@property --mt{syntax:'<length>';inherits:true;initial-value:0px;}
@property --m0{syntax:'<length>';inherits:true;initial-value:0px;}
@property --mb{syntax:'<length>';inherits:true;initial-value:0px;}
@property --ms{syntax:'<length>';inherits:true;initial-value:0px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;width:100%;background:var(--green-900);color:#fff;
  font-family:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
img{display:block;max-width:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;pointer-events:auto}
input,select,textarea{font:inherit}
::selection{background:rgba(207,238,224,.35)}
/* ============ stage & frame ============ */
#site{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#site.hidden{display:none}
.stage{position:absolute;inset:0;background:linear-gradient(180deg,#0c3523 0%,#14503a 45%,#9fd8bf 100%)}
.frame{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;will-change:transform}
.frame.glide{transition:transform var(--glide) cubic-bezier(.65,0,.35,1)}
.frame img.plate,.frame img.cut,.frame img.caseplate,.frame video.trans{position:absolute;pointer-events:none}
.frame .plate{left:0;top:-73.125px;width:1440px;height:956.25px;background:#11402c;object-fit:cover;z-index:1}
.frame .cut{left:0;top:-73.125px;width:1440px;height:956.25px;z-index:4;transition:opacity .26s ease-out}
.frame .caseplate{left:0;top:-105.47px;width:1440px;height:956.25px;object-fit:cover;opacity:0;z-index:7;transition:opacity .5s ease}
.frame .trans{inset:0;left:0;top:0;width:1440px;height:810px;object-fit:cover;opacity:0;z-index:6}
.plate,.caseplate,.trans{
  --mt:70px;--mb:90px;--ms:30px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 var(--mt),#000 calc(100% - var(--mb)),transparent 100%),
                     linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(180deg,transparent 0,#000 var(--mt),#000 calc(100% - var(--mb)),transparent 100%),
             linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  mask-composite:intersect;
  transition:transform var(--glide) cubic-bezier(.65,0,.35,1),opacity .5s ease,
             --mt var(--glide) cubic-bezier(.65,0,.35,1),--mb var(--glide) cubic-bezier(.65,0,.35,1),--ms var(--glide) cubic-bezier(.65,0,.35,1);
}
/* ============ wordmark ============ */
.wm{position:absolute;left:0;top:0;width:1440px;height:260px;z-index:3;overflow:visible;transition:transform .38s cubic-bezier(.5,0,.75,0),opacity .38s cubic-bezier(.5,0,.75,0)}
.wm text{font-family:'Inter Tight',sans-serif;font-weight:900;font-size:246px;letter-spacing:-5px;fill:url(#wmgrad)}
.wm.out{transform:translateY(-40px);opacity:0}
/* ============ script ============ */
.script{position:absolute;z-index:6;font-family:'Caveat Brush',cursive;font-size:52px;line-height:1.04;color:#fff;
  letter-spacing:-.3px;transform:rotate(-7deg);transform-origin:0 50%;max-width:680px;
  text-shadow:0 3px 16px rgba(0,0,0,.28);transition:opacity .3s ease}
.script.out{opacity:0}
/* ============ lanyard badge ============ */
.badge{position:absolute;left:986px;top:-165px;width:582px;height:1030px;transform-origin:288px 0;z-index:5;pointer-events:none;
  transition:transform .38s cubic-bezier(.5,0,.75,0),opacity .38s ease}
.badge.out{transform:translateY(-110%) rotate(-6deg);opacity:0}
.badge .sway{position:absolute;inset:0}
.idle .sway,.idle .m-badge .msway{animation:sway 3.2s ease-in-out infinite alternate}
.badge .bimg{position:absolute;inset:0;width:100%;height:100%}
.badge .card,.m-badge .mcard{position:absolute;left:172px;top:536px;width:238px;height:392px;padding:20px 16px 0 16px;color:#f2f6f3;
  font-family:'Inter Tight',sans-serif;background:#0d1d13;border:1px solid rgba(255,255,255,.09);border-radius:16px}
.badge .card h4,.m-badge .mcard h4{font-size:27px;line-height:.95;font-weight:800;letter-spacing:-.5px;white-space:pre-line;color:#f2f6f3}
.badge .card .yr,.m-badge .mcard .yr{position:absolute;right:16px;top:58px;font-size:11px;font-weight:700}
.badge .card .role,.m-badge .mcard .role{margin-top:10px;padding-top:5px;border-top:1px solid rgba(255,255,255,.55);font-size:9px;font-weight:700;letter-spacing:.2px}
.badge .card .ph,.m-badge .mcard .ph{width:92px;height:112px;margin:11px auto;border-radius:6px;background:#dfe4e1;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);background-size:471px 313px;background-position:-212px -16px;background-repeat:no-repeat}
.badge .card .rows,.m-badge .mcard .rows{margin-top:2px}
.badge .card .row,.m-badge .mcard .row{display:flex;justify-content:space-between;font-size:9px;font-weight:700;padding:5px 0 3px;border-bottom:1.5px dotted rgba(255,255,255,.6)}
.badge .hit{position:absolute;left:160px;top:470px;width:262px;height:440px;pointer-events:auto;cursor:grab}
/* ============ laptop screen ============ */
.screen{position:absolute;left:272.8px;top:102.7px;width:894.4px;height:604.7px;border-radius:3px;background:#000;overflow:hidden;opacity:0;z-index:8;transition:opacity .32s ease}
.case-on .screen{opacity:1}
.screen::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 38%);z-index:2;pointer-events:none}
.screen .media{position:absolute;inset:0;background:#000}
.screen .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.screen .media .ytwrap{position:absolute;inset:0;pointer-events:none;z-index:2}
.screen .media .ytwrap iframe{width:100%;height:100%;border:0}
.screen .media .kb{position:absolute;inset:0;overflow:hidden}
.screen .media .kb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;animation:kb 16s ease-in-out infinite alternate}
.screen .media .kb img.on{opacity:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:3;pointer-events:none;transition:opacity .24s ease}
.screen-hit{position:absolute;left:272.8px;top:102.7px;width:894.4px;height:604.7px;z-index:9;cursor:pointer;pointer-events:none}
.case-on .screen-hit{pointer-events:auto}
.cue{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap;
  padding:10px 22px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  opacity:0;transition:opacity .3s ease,transform .25s ease;pointer-events:none}
.case-on .cue{opacity:1}
.screen-hit:hover .cue{transform:translateX(-50%) scale(1.06)}
.cue .dot{width:6px;height:6px;border-radius:50%;background:var(--mint)}
/* ============ pinned ui ============ */
.ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;height:calc(37*var(--n));padding:0 calc(18*var(--n));display:flex;align-items:center;
  font-weight:650;font-size:calc(16.5*var(--n));letter-spacing:-.02em;color:var(--ink);background:#fff;border-radius:calc(4*var(--n));
  box-shadow:0 calc(3*var(--n)) 0 rgba(0,0,0,.18),0 calc(6*var(--n)) calc(14*var(--n)) rgba(0,0,0,.18);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.tag:hover{transform:translateY(calc(-2*var(--n))) rotate(-1.5deg);box-shadow:0 calc(5*var(--n)) 0 rgba(0,0,0,.2),0 calc(10*var(--n)) calc(22*var(--n)) rgba(0,0,0,.22)}
.tag:active{transform:translateY(calc(1*var(--n)))}
.tag.t1{left:calc(30*var(--n));top:calc(7*var(--n))}
.tag.t2{left:calc(233*var(--n));top:calc(7*var(--n))}
.tag.t3{right:calc(244*var(--n));top:calc(7*var(--n))}
.tag.t4{right:calc(32*var(--n));top:calc(7*var(--n))}
.clogo{position:fixed;left:50%;top:calc(14*var(--n));transform:translateX(-50%);font-weight:700;font-size:calc(19*var(--n));
  letter-spacing:.14em;color:#fff;opacity:0;transition:opacity .4s ease;white-space:nowrap}
.case-on .clogo{opacity:1}
/* ============ mobile hero pieces ============ */
.m-hero{display:none}
.m-wm{position:fixed;top:96px;left:4vw;width:92vw;height:auto;z-index:21;transition:opacity .35s ease,transform .35s ease}
.m-wm text{font-family:'Inter Tight',sans-serif;font-weight:900;font-size:246px;letter-spacing:-5px;fill:url(#wmgrad2)}
.m-script{position:fixed;top:172px;left:8vw;z-index:21;font-family:'Caveat Brush',cursive;font-size:clamp(22px,6.4vw,30px);
  line-height:1.05;color:#fff;transform:rotate(-5deg);max-width:78vw;text-shadow:0 3px 14px rgba(0,0,0,.3);transition:opacity .35s ease}
/* full lanyard badge on mobile — same artwork & card as desktop, scaled down */
.m-badge{position:fixed;top:84px;right:10px;width:582px;height:1030px;transform:scale(.33);transform-origin:top right;
  z-index:21;pointer-events:none;display:none;transition:opacity .35s ease}
.m-badge .msway{position:absolute;inset:0;transform-origin:288px 0}
.m-badge .mbimg{position:absolute;inset:0;width:582px;height:1030px}
.m-badge .mhit{position:absolute;left:130px;top:450px;width:330px;height:510px;pointer-events:auto;cursor:grab}
.case-on .m-wm,.case-on .m-script,.case-on .m-badge{opacity:0;pointer-events:none}
.case-on .m-wm{transform:translateY(-24px)}
/* ============ case ui (ticket + desc) ============ */
.case-ui{position:fixed;inset:0;z-index:22;pointer-events:none}
.ticket{position:absolute;right:calc(32*var(--n));top:calc(98*var(--n));width:calc(356*var(--n));min-height:calc(196*var(--n));
  background:#fff;border-radius:calc(3*var(--n));box-shadow:0 calc(18*var(--n)) calc(40*var(--n)) rgba(0,0,0,.28);
  padding:calc(24*var(--n)) calc(34*var(--n)) calc(18*var(--n)) calc(44*var(--n));color:var(--ink);pointer-events:none;
  opacity:0;transition:opacity .3s ease}
.case-on .ticket{opacity:1;pointer-events:auto}
.ticket.arr{animation:tickIn .48s cubic-bezier(.3,1.5,.5,1) both}
.ticket .hole{position:absolute;width:calc(21*var(--n));height:calc(21*var(--n));border-radius:50%;background:var(--green-800);
  box-shadow:inset 0 calc(2*var(--n)) calc(3*var(--n)) rgba(0,0,0,.35)}
.ticket .h1{top:calc(12*var(--n));left:calc(12*var(--n))}
.ticket .h2{top:calc(12*var(--n));right:calc(12*var(--n))}
.ticket .h3{bottom:calc(12*var(--n));left:calc(12*var(--n))}
.ticket .h4{bottom:calc(12*var(--n));right:calc(12*var(--n))}
.ticket h2{font-family:Anton,sans-serif;font-weight:400;font-size:calc(42*var(--n));line-height:.98;letter-spacing:.2px;color:var(--ink);margin-bottom:calc(10*var(--n))}
.ticket .trow{text-align:right;font-weight:700;font-size:calc(12*var(--n));letter-spacing:.04em;color:#222;
  border-bottom:1.5px dotted #2a2a2a;padding:calc(4*var(--n)) 0 calc(3*var(--n))}
.ticket .tk-btn{margin-top:calc(12*var(--n));width:100%;background:var(--green-900);color:#fff;border-radius:calc(4*var(--n));
  padding:calc(11*var(--n)) calc(10*var(--n));font-weight:600;font-size:calc(11.5*var(--n));letter-spacing:.05em;
  transition:background .2s ease,transform .2s ease}
.ticket .tk-btn:hover{background:var(--green-700);transform:translateY(calc(-1*var(--n)))}
.desc{position:absolute;left:calc(28*var(--n));top:calc(300*var(--n));width:calc(195*var(--n));pointer-events:none;opacity:0;transition:opacity .3s ease}
.case-on .desc{opacity:1;pointer-events:auto}
.desc.arr>*{animation:descIn .5s cubic-bezier(.2,.9,.3,1) both}
.desc.arr>*:nth-child(2){animation-delay:.06s}
.desc.arr>*:nth-child(3){animation-delay:.12s}
.desc.arr>*:nth-child(4){animation-delay:.18s}
.desc.arr>*:nth-child(5){animation-delay:.24s}
.desc .pill{display:inline-block;font-size:calc(10*var(--n));font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mint);border:1px solid rgba(207,238,224,.45);border-radius:999px;padding:calc(5*var(--n)) calc(11*var(--n));background:rgba(11,47,32,.4)}
.desc .k{margin-top:calc(10*var(--n));font-weight:700;font-size:calc(17*var(--n));line-height:1.2;color:#fff;white-space:pre-line}
.desc p{margin-top:calc(8*var(--n));font-size:calc(15*var(--n));line-height:1.36;font-weight:500;color:rgba(255,255,255,.92)}
.desc .num{margin-top:calc(12*var(--n));font-size:calc(12*var(--n));letter-spacing:.16em;font-weight:700;color:rgba(255,255,255,.85)}
.desc .browse{margin-top:calc(14*var(--n));font-size:calc(11.5*var(--n));font-weight:600;letter-spacing:.08em;color:#fff;
  border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:calc(8*var(--n)) calc(14*var(--n));
  background:rgba(255,255,255,.06);transition:background .2s ease}
.desc .browse:hover{background:rgba(255,255,255,.16)}
/* ============ prev / next ============ */
.pn{position:fixed;bottom:calc(150*var(--n));display:flex;align-items:center;gap:calc(12*var(--n));z-index:22;
  opacity:0;pointer-events:none;transition:opacity .3s ease}
.case-on .pn{opacity:1;pointer-events:auto}
.pn.arr{animation:descIn .5s cubic-bezier(.2,.9,.3,1) both}
.pn.prev{left:calc(95*var(--n))}
.pn.next{right:calc(95*var(--n))}
.pn .c{width:calc(50*var(--n));height:calc(50*var(--n));border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s ease,color .2s ease,border-color .2s ease}
.pn .c svg{width:calc(24*var(--n));height:calc(24*var(--n))}
.pn:hover .c{transform:scale(1.08)}
.pn.prev .c{border:calc(1.5*var(--n)) solid rgba(255,255,255,.75);color:#fff}
.pn.next .c{background:#fff;color:var(--green-800)}
.pn.next:hover .c{background:var(--mint)}
.pn .lbl{font-size:calc(10*var(--n));letter-spacing:.14em;text-transform:uppercase;line-height:1.5;text-align:left;color:rgba(255,255,255,.92);white-space:pre-line}
/* ============ bottom bar ============ */
.socialbar{position:fixed;left:calc(28*var(--n));bottom:calc(16*var(--n));z-index:25;display:flex;gap:calc(14*var(--n));align-items:center;
  background:rgba(11,47,32,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:calc(6*var(--n)) calc(14*var(--n));pointer-events:auto;max-width:92vw}
.socialbar a{display:flex;gap:calc(6*var(--n));align-items:center;font-weight:600;font-size:calc(12*var(--n));letter-spacing:.02em;color:#fff;
  opacity:.92;transition:opacity .2s ease,transform .2s ease;white-space:nowrap}
.socialbar a:hover{opacity:1;transform:translateY(calc(-1*var(--n)))}
.socialbar svg{width:calc(15*var(--n));height:calc(15*var(--n));flex:0 0 auto}
.socialbar .sb-sep{width:1px;height:calc(14*var(--n));background:rgba(255,255,255,.25)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22*var(--n));z-index:24;text-align:center;
  font-size:calc(12*var(--n));letter-spacing:.18em;text-transform:uppercase;font-weight:600;opacity:.85;transition:opacity .3s ease}
.hint .stem{position:relative;display:block;width:calc(1.5*var(--n));height:calc(22*var(--n));margin:calc(8*var(--n)) auto 0;
  background:rgba(255,255,255,.35);overflow:hidden;border-radius:2px}
.hint .stem i{position:absolute;left:0;top:-30%;width:100%;height:30%;background:#fff;border-radius:2px;animation:drip 1.6s cubic-bezier(.6,0,.4,1) infinite}
.case-on .hint{opacity:0;pointer-events:none}
.busy .hint{opacity:0}
/* ============ entrance & keyframes ============ */
.pre .tag,.pre .wm,.pre .script,.pre .badge,.pre .socialbar,.pre .hint,.pre .m-wm,.pre .m-script,.pre .m-badge{opacity:0}
.entering .tag{animation:inTag .7s cubic-bezier(.3,1.5,.5,1) backwards}
.entering .tag:nth-child(1){animation-delay:.12s}
.entering .tag:nth-child(2){animation-delay:.2s}
.entering .tag:nth-child(3){animation-delay:.28s}
.entering .tag:nth-child(4){animation-delay:.36s}
.entering .wm{animation:inWm 1.1s cubic-bezier(.3,1,.3,1) .26s backwards}
.entering .script{animation:inScript .9s cubic-bezier(.5,0,.3,1) 1.05s backwards}
.entering .badge{animation:inBadge 1.5s cubic-bezier(.3,1.4,.4,1) .7s backwards}
.entering .m-badge .msway{animation:inBadge 1.5s cubic-bezier(.3,1.4,.4,1) .7s backwards}
.entering .socialbar{animation:inBottom .6s cubic-bezier(.2,.9,.3,1) 1.65s backwards}
.entering .hint{animation:inBottom .6s cubic-bezier(.2,.9,.3,1) 1.65s backwards}
.replay .wm{animation:inWm 1.1s cubic-bezier(.3,1,.3,1) .1s backwards}
.replay .script{animation:inScript .9s cubic-bezier(.5,0,.3,1) .45s backwards}
.replay .badge{animation:inBadge 1.5s cubic-bezier(.3,1.4,.4,1) .2s backwards}
.replay .m-badge .msway{animation:inBadge 1.5s cubic-bezier(.3,1.4,.4,1) .2s backwards}
.replay .hint{animation:inBottom .6s cubic-bezier(.2,.9,.3,1) .6s backwards}
@keyframes inTag{from{opacity:0;transform:translateY(-40px) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes inWm{from{opacity:0;transform:translateY(60px);clip-path:inset(100% 0 0 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes inScript{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes inBadge{0%{opacity:0;transform:translateY(-120%) rotate(8deg)}60%{opacity:1;transform:translateY(0) rotate(-3deg)}80%{transform:rotate(1.6deg)}100%{transform:rotate(0)}}
@keyframes inBottom{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
@keyframes drip{to{top:100%}}
@keyframes kb{0%{transform:scale(1.02) translate(0,0)}50%{transform:scale(1.14) translate(-1.6%,1.2%)}100%{transform:scale(1.06) translate(1.2%,-1%)}}
@keyframes tickIn{from{opacity:0;transform:translateY(-24px) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes descIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rockTicket{0%{transform:rotate(-1.5deg) scale(.98)}100%{transform:none}}
.ticket.rock{animation:rockTicket .28s ease both}
/* ============ responsive (mobile) ============ */
@media (max-width:820px){
  .tags{position:fixed;inset:auto;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start}
  .tag{position:relative;left:auto !important;right:auto !important;top:auto !important;height:34px;padding:0 14px;font-size:13.5px;border-radius:6px}
  .clogo{display:none}
  .m-hero{display:block}
  .wm,.script,.badge{display:none}
  .case-ui{position:fixed;inset:auto;top:88px;left:12px;right:12px;display:flex;flex-direction:column;gap:10px}
  .ticket{position:relative;inset:auto;width:auto;min-height:0;padding:14px 16px 12px;border-radius:8px;right:auto;top:auto}
  .ticket h2{font-size:clamp(22px,6.2vw,30px);margin-bottom:8px}
  .ticket .trow{font-size:11px;padding:3px 0 2px}
  .ticket .tk-btn{padding:10px;font-size:11px;margin-top:10px}

.proj-row{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(255,255,255,.03);margin-bottom:10px;flex-wrap:wrap}
.proj-row img{width:86px;height:56px;object-fit:cover;border-radius:9px;background:#000;flex:0 0 auto}
.proj-row .pi{flex:1;min-width:180px}
.proj-row .pi .t{font-weight:800;font-size:14.5px}
.proj-row .pi .m{font-size:11px;color:rgba(232,241,236,.6);font-weight:600;letter-spacing:.05em;margin-top:3px;text-transform:uppercase}
.proj-row .acts{display:flex;gap:7px;flex-wrap:wrap}
.ib{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;cursor:pointer;transition:background .2s ease}
.ib:hover{background:rgba(255,255,255,.16)}
.ib.del:hover{background:rgba(220,60,60,.2);color:#ff9c9c}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:12px}
.ph-item{position:relative;border-radius:11px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#000}
.ph-item.cover{outline:2px solid var(--mint);outline-offset:1px}
.ph-item img{width:100%;height:86px;object-fit:cover;display:block}
.ph-item .cover-tag{position:absolute;top:5px;left:5px;font-size:8.5px;font-weight:900;letter-spacing:.1em;background:var(--mint);color:var(--ink);border-radius:5px;padding:2px 6px}
.ph-item .pacts{position:absolute;bottom:5px;left:5px;right:5px;display:flex;gap:4px;justify-content:center}
.ph-item .pacts .ib{width:24px;height:24px;font-size:11px;border-radius:7px;background:rgba(0,0,0,.6)}
.ph-item input{width:100%;border:0;border-top:1px solid rgba(255,255,255,.1);background:#0a160d;color:#cfe0d6;font-size:10.5px;padding:4px 6px;outline:none}
.upzone{border:2px dashed rgba(207,238,224,.35);border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:background .2s ease,border-color .2s ease}
.upzone:hover,.upzone.drag{background:rgba(207,238,224,.07);border-color:rgba(207,238,224,.7)}
.upzone .big{font-size:14.5px;font-weight:800;color:#fff}
.upzone .sm2{font-size:11.5px;color:rgba(232,241,236,.6);margin-top:4px;font-weight:500}
.uplist{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.uprow{display:flex;gap:10px;align-items:center;font-size:12px;color:rgba(232,241,236,.85)}
.uprow .nm{width:32%;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.uprow .bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.uprow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-700),var(--mint));width:0%;transition:width .25s ease;border-radius:99px}
.uprow .st{width:64px;text-align:right;font-weight:700;font-size:11px;color:var(--mint)}
.yt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.yt-row .fi{flex:1}
.yt-prev{position:relative;aspect-ratio:16/9;max-width:430px;border-radius:12px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.12);margin-top:10px}
.yt-prev iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-prev .none{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:12.5px;font-weight:600}
.sw{width:40px;height:23px;border-radius:999px;background:#274b3b;position:relative;transition:background .2s ease;cursor:pointer;flex:0 0 auto;border:0}
.sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s ease}
.sw.on{background:var(--green-700)}
.sw.on i{left:20px}
.tgl-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.tgl-row:last-child{border-bottom:0}
.tgl-row .nm{flex:1;font-weight:700;font-size:13.5px}
.tgl-row .nm small{display:block;font-size:11px;color:rgba(232,241,236,.55);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.svc-row{border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:12px;background:rgba(255,255,255,.03);margin-bottom:10px}
.sqlbox{width:100%;min-height:220px;background:#050b06;border:1px solid rgba(255,255,255,.13);color:#a9d8bd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;border-radius:12px;padding:14px;white-space:pre;overflow-x:auto}
.leads .lead{border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:10px 13px;margin-bottom:8px;font-size:12.5px;line-height:1.55}
.leads .lead b{color:var(--mint)}
.leads .lead .when{float:right;font-size:10.5px;color:rgba(232,241,236,.5)}
/* admin login */
.adm-login{min-height:100%;display:grid;place-items:center;padding:24px}
.adm-login .box{width:min(400px,94vw);background:#0d1d13;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:30px 28px;text-align:center}
.adm-login .lgo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--green-700),var(--green-900));display:grid;place-items:center;margin:0 auto 16px;font-weight:900;font-size:17px;color:var(--mint);border:1px solid rgba(207,238,224,.3)}
.adm-login h1{font-size:21px;font-weight:800;letter-spacing:.02em}
.adm-login .sub2{font-size:12px;color:rgba(232,241,236,.6);margin:6px 0 18px;font-weight:500}
.adm-login .hintp{margin-top:14px;font-size:11px;color:rgba(207,238,224,.75);background:rgba(207,238,224,.08);border:1px dashed rgba(207,238,224,.3);border-radius:10px;padding:9px 12px;font-weight:600;line-height:1.5}
.adm-login input{text-align:center;letter-spacing:.2em}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#0f2a1e;border:1px solid #2c5a44;color:#eaf7f0;
  padding:11px 20px;border-radius:999px;z-index:400;box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:13.5px;font-weight:600;opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:900px){
  .adm-wrap{flex-direction:column;gap:14px;padding:16px 14px 50px}
  .adm-nav{position:static;flex-direction:row;overflow-x:auto;gap:8px;min-width:0;width:100%;padding-bottom:4px;scrollbar-width:none}
  .adm-nav::-webkit-scrollbar{display:none}
  .adm-tab{flex:0 0 auto;white-space:nowrap}
  .row2,.row3{grid-template-columns:1fr}
}
@media (max-width:600px){
  .ap-grid{grid-template-columns:1fr}
}
</style>

/* ---------- image compression (client-side, max 2048px WebP q0.85) ---------- */
function compressImage(file, onProg) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('Not an image file')); return; }
    onProg && onProg(0.08);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      onProg && onProg(0.3);
      try {
        const sc = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * sc));
        c.height = Math.max(1, Math.round(img.naturalHeight * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        onProg && onProg(0.55);
        let dataUrl = null;
        try { dataUrl = c.toDataURL('image/webp', 0.85); } catch (e) { /* older engines */ }
        c.toBlob((blob) => {
          if (!blob) { reject(new Error('Could not encode image')); return; }
          onProg && onProg(0.8);
          resolve({ dataUrl, blob, w: c.width, h: c.height });
        }, dataUrl && dataUrl.indexOf('data:image/webp') === 0 ? 'image/webp' : 'image/jpeg', 0.85);
      } catch (err) { URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image file')); };
    img.src = url;
  });
}

function idbOpen() {

    const req = indexedDB.open('ab-visuals-db', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbTx(store, mode, fn) {

    const tx = db.transaction(store, mode);
    const st = tx.objectStore(store);
    let out;
    try { out = fn(st); } catch (e) { reject(e); return; }
    tx.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  }));
}

function waitForFirebase(timeoutMs) {
  if (window.__ABV_FIREBASE__) return Promise.resolve(window.__ABV_FIREBASE__);
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      resolve(window.__ABV_FIREBASE__ || null);
    };
    window.__ABV_ON_FIREBASE_READY__ = finish;
    setTimeout(finish, timeoutMs || 5000);
  });
}
async function makeAdapter() {

/* ---------- lightbox ---------- */
const lbRoot = $('#lightbox');
let lbState = { list: [], i: 0 };
function openLightbox(list, i) { lbState = { list, i }; renderLb(); lbRoot.classList.add('on'); }
function closeLightbox() { lbRoot.classList.remove('on'); lbRoot.innerHTML = ''; lbState = { list: [], i: 0 }; }
function lbStep(d) {
  const n = lbState.list.length;
  if (!n) return;
  lbState.i = ((lbState.i + d) % n + n) % n;
  renderLb();
}
function renderLb() {
  const { list, i } = lbState;
  const g = list[i];
  if (!g) { closeLightbox(); return; }
  lbRoot.classList.remove('zoom');
  lbRoot.innerHTML =
    '<img class="lb-img" src="' + escAttr(g.url) + '" alt="' + escAttr(g.caption || 'photo') + '">' +
    '<div class="lb-top"><span class="cnt">' + (i + 1) + ' / ' + list.length + '</span><div class="acts">' +
    '<button class="iconbt" id="lb-zoom" title="Zoom in / out">+</button>' +
    '<button class="iconbt" id="lb-close" title="Close (Esc)">\u2715</button></div></div>' +
    '<button class="arr l" id="lb-prev" title="Previous (\u2190)">\u2190</button>' +
    '<button class="arr r" id="lb-next" title="Next (\u2192)">\u2192</button>' +
    '<div class="thumbs">' + list.map((t, j) => '<img src="' + escAttr(t.url) + '" class="' + (j === i ? 'on' : '') + '" data-j="' + j + '" loading="lazy" alt="">').join('') + '</div>';
  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lb-zoom').addEventListener('click', () => lbRoot.classList.toggle('zoom'));
  $('#lb-prev').addEventListener('click', () => lbStep(-1));
  $('#lb-next').addEventListener('click', () => lbStep(1));
  $$('.thumbs img', lbRoot).forEach((im) => im.addEventListener('click', () => { lbState.i = +im.dataset.j; renderLb(); }));
}
let lbTouch = null;
lbRoot.addEventListener('touchstart', (e) => { const t = e.touches[0]; lbTouch = { x: t.clientX, y: t.clientY }; }, { passive: true });
lbRoot.addEventListener('touchend', (e) => {
  if (!lbTouch) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - lbTouch.x;
  lbTouch = null;
  if (Math.abs(dx) > 40) lbStep(dx < 0 ? 1 : -1);
}, { passive: true });

    $$('.ed-yt-url', host).forEach((inp) => {
      const sync = () => { e.youtube_urls[+inp.dataset.j] = inp.value.trim(); edYtPreview(); };
      inp.addEventListener('input', sync);
      inp.addEventListener('change', sync);
    });
    $$('.ed-yt-up', host).forEach((b) => b.addEventListener('click', () => {
      const j = +b.dataset.j;
      if (j > 0) { const t = e.youtube_urls[j - 1]; e.youtube_urls[j - 1] = e.youtube_urls[j]; e.youtube_urls[j] = t; renderYtRows(); }
    }));
    $$('.ed-yt-dn', host).forEach((b) => b.addEventListener('click', () => {
      const j = +b.dataset.j;
      if (j < e.youtube_urls.length - 1) { const t = e.youtube_urls[j + 1]; e.youtube_urls[j + 1] = e.youtube_urls[j]; e.youtube_urls[j] = t; renderYtRows(); }
    }));
    $$('.ed-yt-del', host).forEach((b) => b.addEventListener('click', () => {
      e.youtube_urls.splice(+b.dataset.j, 1);
      renderYtRows();
    }));
    edYtPreview();
  };
  $('#ed-yt-add').addEventListener('click', () => {
    const v = $('#ed-yt-in').value.trim();
    if (!ytId(v)) { toast('That does not look like a valid YouTube link'); return; }
    e.youtube_urls = e.youtube_urls || [];
    e.youtube_urls.push(v);
    $('#ed-yt-in').value = '';
    renderYtRows();
  });
  $('#ed-yt-in').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); $('#ed-yt-add').click(); } });
  $('#ed-yt-in').addEventListener('input', edYtPreview);
  renderYtRows();
  /* direct image URL adder */
  const imgAddBtn = $('#ed-img-add');
  if (imgAddBtn) imgAddBtn.addEventListener('click', () => {
    const url = ($('#ed-img-url').value || '').trim();
    if (!/^https?:\/\//i.test(url)) { toast('Paste a valid https:// image URL'); return; }
    e.gallery_images = e.gallery_images || [];
    e.gallery_images.push({ id: uid(), url, caption: '', w: 0, h: 0 });
    if (!e.cover_image_url) e.cover_image_url = url;
    $('#ed-img-url').value = '';
    renderEditorGallery();
    const cnt = $('#ed-photo-cnt');
    if (cnt) cnt.textContent = 'Saved ' + e.gallery_images.length + ' photo(s) on this project';
    toast('Photo URL added');
  });
  /* uploads */
  const drop = $('#ed-drop'), file = $('#ed-file');
  drop.addEventListener('click', () => file.click());
  file.addEventListener('change', () => { handleEditorFiles(file.files); file.value = ''; });
  ['dragover', 'dragenter'].forEach((ev) => drop.addEventListener(ev, (e2) => { e2.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e2) => { e2.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', (e2) => { if (e2.dataTransfer && e2.dataTransfer.files.length) handleEditorFiles(e2.dataTransfer.files); });
}
function edYtPreview() {
  const box = $('#ed-yt-prev');
  if (!box) return;
  const typed = $('#ed-yt-in') ? $('#ed-yt-in').value.trim() : '';
  const id = ytId(typed) || ytId((ADMIN.editing.youtube_urls || [])[0] || '');
  box.innerHTML = id
    ? '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?rel=0&modestbranding=1&playsinline=1" allowfullscreen title="preview"></iframe>'
    : '<div class="none">Live YouTube preview appears here</div>';
}
async function handleEditorFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  const box = $('#ed-uplist');
  for (const f of list) {
    const row = elFromHTML('<div class="uprow"><span class="nm">' + esc(f.name) + '</span><span class="bar"><i></i></span><span class="st">0%</span></div>');
    box.appendChild(row);
    const bar = $('i', row), st = $('.st', row);
    try {
      const res = await App.adapter.uploadImage(f, (p) => { bar.style.width = Math.round(p * 100) + '%'; st.textContent = Math.round(p * 100) + '%'; });
      ADMIN.editing.gallery_images.push({ id: uid(), url: res.url, caption: '', w: res.w || 0, h: res.h || 0, mediaId: res.mediaId });
      bar.style.width = '100%'; st.textContent = 'Done';
      if (!ADMIN.editing.cover_image_url) ADMIN.editing.cover_image_url = res.url;
      renderEditorGallery();
    } catch (err) {
      st.textContent = 'Failed'; row.style.color = '#ff9c9c';
      toast('Upload failed: ' + err.message);
    }
  }
  const cnt = $('#ed-photo-cnt');
  if (cnt) cnt.textContent = 'Saved ' + ADMIN.editing.gallery_images.length + ' photo(s) on this project';
}
function renderEditorGallery() {
  const grid = $('#ed-gal');
  if (!grid) return;
  const e = ADMIN.editing;
  grid.innerHTML = (e.gallery_images || []).map((g, j) =>
    '<div class="ph-item' + (g.url === e.cover_image_url ? ' cover' : '') + '">' +

    '<button class="ib" data-a="r" data-j="' + j + '" title="Move right">\u2192</button>' +

    '</div>').join('');

    else if (a === 'l' && j > 0) { const t = arr[j - 1]; arr[j - 1] = arr[j]; arr[j] = t; }
    else if (a === 'r' && j < arr.length - 1) { const t = arr[j + 1]; arr[j + 1] = arr[j]; arr[j] = t; }
    else if (a === 'del') { if (e.cover_image_url === arr[j].url) e.cover_image_url = ''; arr.splice(j, 1); }
    renderEditorGallery();
  }));
  $$('input[data-a="cap"]', grid).forEach((inp) => {
    const sync = () => { e.gallery_images[+inp.dataset.j].caption = inp.value; };
    inp.addEventListener('input', sync);

async function saveProjectEditor() {
  const e = ADMIN.editing;
  if (!e) { toast('Nothing to save'); return; }
  const gv = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const gr = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
  const saveBtn = $('#ed-save');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026'; }
  try {
    const isNew = Boolean(e.__isNew);
    const placeFirst = isNew && $('#ed-pos') && $('#ed-pos').value === 'first';
    delete e.__isNew;
    e.title = gv('ed-title') || 'UNTITLED PROJECT';
    e.slug = slugify(e.title);
    e.category = $('#ed-cat').value === '__custom' ? (gv('ed-cat-custom') || SERVICES_PRESETS[0]) : $('#ed-cat').value;
    e.location = gv('ed-loc');
    e.year = gv('ed-year');
    e.ticket_rows = [gr('ed-tr0'), gr('ed-tr1'), gr('ed-tr2')];
    e.short_key = gr('ed-key');
    e.short_desc = gv('ed-short');
    e.full_description = gr('ed-full');
    e.preview_video_url = gv('ed-prev');
    e.is_published = $('#ed-pub') ? $('#ed-pub').classList.contains('on') : (e.is_published !== false);
    const pendingYt = gv('ed-yt-in');
    if (pendingYt && ytId(pendingYt) && !(e.youtube_urls || []).includes(pendingYt)) {
      e.youtube_urls = (e.youtube_urls || []).concat([pendingYt]);
    }
    e.youtube_urls = (e.youtube_urls || []).map((u) => String(u || '').trim()).filter(Boolean);
    if (isNew) {
      e.sort_order = placeFirst ? 0 : ADMIN.list.length;
    }
    await App.adapter.saveProject(e);
    if (placeFirst && ADMIN.list.length > 0) {
      const updatedOrder = [e].concat(ADMIN.list.filter((x) => x.id !== e.id));
      updatedOrder.forEach((pp, k) => { pp.sort_order = k; });
      await App.adapter.reorderProjects(updatedOrder);
    }
    toast('Project saved' + (App.adapter.name === 'firebase' ? ' to Firebase \u2014 live for all visitors' : ' on this device'));
    ADMIN.editing = null;
    const pe = $('#proj-editor');
    if (pe) pe.innerHTML = '';
    await reloadAdminList(); renderStats(); renderProjectList(); await reloadPublished();
  } catch (err) {
    toast('Save failed: ' + err.message);
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save Project Live'; }
  }
}

    '<label class="lb2" style="margin-top:10px">Meta Description</label><textarea class="fi" id="seo-desc" style="min-height:64px">' + esc(cms.seo.description || '') + '</textarea></div>' +
    '<div class="card"><h3>Optional Visuals &amp; Theme Overrides</h3><div class="hintx">Leave untouched to keep the exact original AB VISUALS design &amp; plates. Upload custom images or pick colors only if you want to restyle from here.</div>' +
    '<div class="row3">' +
      '<div><label class="lb2">Hero Background Plate</label><div class="bt-row"><input type="file" id="vis-plate-f" accept="image/*" style="display:none"><button class="bt ghost sm" id="vis-plate-btn" type="button">Upload Plate</button>' + (v.heroPlateUrl ? '<button class="bt ghost sm" id="vis-plate-rst" type="button">Reset</button>' : '') + '</div></div>' +
      '<div><label class="lb2">Hero Foreground Cutout</label><div class="bt-row"><input type="file" id="vis-cut-f" accept="image/*" style="display:none"><button class="bt ghost sm" id="vis-cut-btn" type="button">Upload Cutout</button>' + (v.heroCutUrl ? '<button class="bt ghost sm" id="vis-cut-rst" type="button">Reset</button>' : '') + '</div></div>' +
      '<div><label class="lb2">Laptop Scene Background</label><div class="bt-row"><input type="file" id="vis-case-f" accept="image/*" style="display:none"><button class="bt ghost sm" id="vis-case-btn" type="button">Upload Scene</button>' + (v.casePlateUrl ? '<button class="bt ghost sm" id="vis-case-rst" type="button">Reset</button>' : '') + '</div></div>' +
    '</div>' +
    '<div class="row2" style="margin-top:12px">' +
      '<div><label class="lb2">Primary Background Hex (blank = default #0b2f20)</label><input class="fi" id="vis-bg" value="' + escAttr(v.bgDark || '') + '" placeholder="#0b2f20"></div>' +
      '<div><label class="lb2">Accent Highlight Hex (blank = default #cfeee0)</label><input class="fi" id="vis-mint" value="' + escAttr(v.accentMint || '') + '" placeholder="#cfeee0"></div>' +
    '</div></div>' +
    '<div class="bt-row"><button class="bt" id="tx-save">Save All Site Changes Live</button></div>';

  /* Bind badge 4-row inputs live */
  $$('.bdl', main).forEach((inp) => {
    const syncRow = () => {
      const j = +inp.dataset.j;
      if (b.rows && b.rows[j]) b.rows[j][inp.dataset.k] = inp.value;
    };
    inp.addEventListener('input', syncRow);
    inp.addEventListener('change', syncRow);
  });

  const renderSvcs = () => {
    $('#svc-list').innerHTML = (cms.services || []).map((sv, j) =>
      '<div class="svc-row"><div class="row2"><input class="fi svx" data-j="' + j + '" data-k="title" value="' + escAttr(sv.title) + '" placeholder="title">' +
      '<select class="fi svx" data-j="' + j + '" data-k="icon">' + ['drone', 'film', 'heart', 'video', 'music', 'building', 'rocket'].map((ic) => '<option' + (sv.icon === ic ? ' selected' : '') + '>' + ic + '</option>').join('') + '</select></div>' +
      '<textarea class="fi svx" data-j="' + j + '" data-k="desc" style="min-height:52px;margin-top:8px" placeholder="short description">' + esc(sv.desc) + '</textarea>' +
      '<div class="row2" style="margin-top:8px"><input class="fi svx" data-j="' + j + '" data-k="tag" value="' + escAttr(sv.tag || '') + '" placeholder="tag">' +
      '<div class="bt-row"><button class="ib" data-up="' + j + '" type="button">\u2191</button><button class="ib" data-dn="' + j + '" type="button">\u2193</button><button class="ib del" data-rm="' + j + '" type="button">\u2715</button></div></div></div>').join('');
    $$('.svx', $('#svc-list')).forEach((inp) => {
      const sync = () => { cms.services[+inp.dataset.j][inp.dataset.k] = inp.value; };
      inp.addEventListener('input', sync);
      inp.addEventListener('change', sync);
    });
    $$('[data-up]', $('#svc-list')).forEach((bt) => bt.addEventListener('click', () => { const j = +bt.dataset.up; if (j > 0) { const t = cms.services[j - 1]; cms.services[j - 1] = cms.services[j]; cms.services[j] = t; renderSvcs(); } }));
    $$('[data-dn]', $('#svc-list')).forEach((bt) => bt.addEventListener('click', () => { const j = +bt.dataset.dn; if (j < cms.services.length - 1) { const t = cms.services[j + 1]; cms.services[j + 1] = cms.services[j]; cms.services[j] = t; renderSvcs(); } }));
    $$('[data-rm]', $('#svc-list')).forEach((bt) => bt.addEventListener('click', () => { cms.services.splice(+bt.dataset.rm, 1); renderSvcs(); }));
  };
  renderSvcs();
  $('#svc-add').addEventListener('click', () => { cms.services.push({ title: 'New Service', desc: 'Short description.', tag: 'Tag', icon: 'drone' }); renderSvcs(); });
  $('#bd-photo-btn').addEventListener('click', () => $('#bd-photo').click());
  $('#bd-photo').addEventListener('change', async (e2) => {
    const f = e2.target.files[0];
    if (!f) return;
    toast('Optimizing photo\u2026');
    try { const res = await App.adapter.uploadImage(f, () => {}); cms.badge.photoUrl = res.url; renderTextTab(main); toast('Badge photo uploaded \u2014 press Save All Site Changes Live'); }
    catch (err) { toast('Upload failed: ' + err.message); }
  });
  const rst = $('#bd-photo-reset');
  if (rst) rst.addEventListener('click', () => { cms.badge.photoUrl = ''; renderTextTab(main); });

  /* Optional visual image uploaders */
  const bindVisUpload = (btnId, fileId, rstId, key, label) => {
    const btn = $('#' + btnId), fl = $('#' + fileId), rb = $('#' + rstId);
    if (btn && fl) {
      btn.addEventListener('click', () => fl.click());
      fl.addEventListener('change', async (ev) => {
        const f = ev.target.files[0];
        if (!f) return;
        toast('Uploading ' + label + '\u2026');
        try { const res = await App.adapter.uploadImage(f, () => {}); cms.visuals[key] = res.url; renderTextTab(main); toast(label + ' ready \u2014 press Save All Site Changes Live'); }
        catch (err) { toast('Upload failed: ' + err.message); }
      });
    }
    if (rb) rb.addEventListener('click', () => { cms.visuals[key] = ''; renderTextTab(main); });
  };
  bindVisUpload('vis-plate-btn', 'vis-plate-f', 'vis-plate-rst', 'heroPlateUrl', 'Hero Plate');
  bindVisUpload('vis-cut-btn', 'vis-cut-f', 'vis-cut-rst', 'heroCutUrl', 'Hero Cutout');
  bindVisUpload('vis-case-btn', 'vis-case-f', 'vis-case-rst', 'casePlateUrl', 'Case Scene');

  $('#tx-save').addEventListener('click', async () => {
    h.wordmark = $('#tx-wm').value.trim() || 'AB VISUALS';
    h.script = $('#tx-script').value;
    h.scrollHint = $('#tx-hint').value;
    b.heading = $('#bd-head').value;
    b.year = $('#bd-year').value.trim();
    b.role = $('#bd-role').value;
    /* Read all 4 badge rows directly from DOM so edits are guaranteed to save */
    $$('.bdl', main).forEach((inp) => {
      const j = +inp.dataset.j;
      if (b.rows && b.rows[j]) b.rows[j][inp.dataset.k] = inp.value;
    });
    n.t1 = $('#nv-t1').value; n.t2 = $('#nv-t2').value; n.t3 = $('#nv-t3').value; n.t4 = $('#nv-t4').value;
    n.caseLogo = $('#nv-logo').value; n.ticketBtn = $('#nv-tbtn').value;
    n.hoverCue = $('#nv-cue').value; n.allHeading = $('#nv-all').value; n.browseBtn = $('#nv-browse').value;
    n.prevLabel = $('#nv-prev').value; n.nextLabel = $('#nv-next').value;
    const parsedCats = ($('#tx-cats').value || '').split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
    cms.categories = parsedCats.length ? parsedCats : SERVICES_PRESETS.slice();
    cms.seo = {
      title: $('#seo-title').value.trim() || DEFAULT_SITE.seo.title,
      description: $('#seo-desc').value.trim() || DEFAULT_SITE.seo.description
    };
    cms.visuals = Object.assign({}, cms.visuals, {
      bgDark: $('#vis-bg').value.trim(),
      accentMint: $('#vis-mint').value.trim()
    });
    try { await App.adapter.saveSite(cms); applyCms(); toast('All site settings saved \u2014 updated live for everyone'); }
    catch (err) { toast('Save failed: ' + err.message); }
  });
}
/* ---------- tab 4: cloud & security ---------- */
function renderSettingsTab(main) {
  const isCloud = App.adapter && App.adapter.name === 'firebase';
  const cfg = isCloud && App.adapter.config ? App.adapter.config : {};
  const userEmail = ADMIN.user ? ADMIN.user.email : '';
  const projectId = cfg.projectId || 'rudranil-backup';
  const authDomainsUrl = 'https://console.firebase.google.com/project/' + encodeURIComponent(projectId) + '/authentication/settings';
  const origin = location.origin && location.origin !== 'null' ? location.origin : '';
  main.innerHTML =
    '<div class="card"><h3>Firebase Cloud Database &amp; Storage</h3>' +
      '<div class="hintx">Connected directly to Firebase Firestore &amp; Firebase Storage. Every portfolio project, photo upload, YouTube link, contact edit, and site text update you save here syncs live to <b>all visitors on all devices</b>.</div>' +
      '<div class="row2">' +
        '<div><label class="lb2">Firebase Project ID</label><input class="fi" value="' + escAttr(cfg.projectId || 'Not connected') + '" readonly></div>' +
        '<div><label class="lb2">Storage Bucket</label><input class="fi" value="' + escAttr(cfg.storageBucket || 'Not configured') + '" readonly></div>' +
      '</div>' +
      '<div class="row2" style="margin-top:10px">' +
        '<div><label class="lb2">Firestore Database</label><input class="fi" value="' + escAttr(cfg.firestoreDatabaseId || '(default)') + '" readonly></div>' +
        '<div><label class="lb2">Cloud Sync Status</label><input class="fi" value="' + (isCloud ? 'Connected \u2022 Real-Time Sync Active' : 'Offline Local Preview') + '" readonly></div>' +
      '</div>' +
      (isCloud ? '<div class="bt-row" style="margin-top:12px"><button class="bt ghost sm" id="fb-health-btn" type="button">Test Live Firebase Sync</button><span id="fb-health-out" style="font-size:12px;color:rgba(207,238,224,.8)"></span></div>' : '') +
    '</div>' +
    '<div class="card"><h3>Admin Panel URLs &amp; Vercel Domain Setup</h3>' +
      '<div class="hintx">Your Admin Panel works on all three URLs: <code>/amit231106</code>, <code>/amit231106.html</code>, and <code>/#/amit231106</code>. When hosting on Vercel or a custom domain, add your domain in Firebase Authorized Domains so Google Admin Login works there too.</div>' +
      '<div class="row2">' +
        '<div><label class="lb2">Direct Admin URL</label><input class="fi" value="' + escAttr(origin ? origin + '/amit231106' : '/amit231106') + '" readonly></div>' +
        '<div><label class="lb2">Hash Fallback URL</label><input class="fi" value="' + escAttr(origin ? origin + '/#/amit231106' : '/#/amit231106') + '" readonly></div>' +
      '</div>' +
      '<div class="bt-row" style="margin-top:12px"><a class="bt ghost sm" href="' + escAttr(authDomainsUrl) + '" target="_blank" rel="noopener">Manage Firebase Authorized Domains \u2197</a></div>' +
    '</div>' +
    '<div class="card"><h3>Admin Authentication</h3>' +
      '<div class="hintx">Protected by Firebase Google Authentication and Firestore Security Rules. Only verified studio administrators can add, edit, or delete portfolio data.</div>' +
      '<div class="bt-row">' +
        '<span style="font-size:13px;color:rgba(232,241,236,.85)">Signed in as: <b>' + esc(userEmail || 'Local Preview') + '</b></span>' +
        (isCloud ? '<button class="bt ghost sm" id="fb-switch">Switch Account</button><button class="bt danger sm" id="fb-signout">Sign Out</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="card"><h3>Backup, Restore &amp; Reset</h3><div class="hintx">Export includes every project, photo and all site text. Import replaces everything in Firebase \u2014 use carefully.</div>' +
    '<div class="bt-row"><button class="bt ghost" id="bk-export">Export Backup JSON</button>' +
    '<input type="file" id="bk-file" accept="application/json,.json" style="display:none"><button class="bt ghost" id="bk-import">Import Backup JSON</button>' +
    '<button class="bt ghost" id="bk-demo">Restore Demo Projects</button>' +
    '<button class="bt danger" id="bk-reset">Reset Text to Defaults</button></div></div>';

  const healthBtn = $('#fb-health-btn');
  if (healthBtn && typeof App.adapter.checkHealth === 'function') {
    healthBtn.addEventListener('click', async () => {
      const out = $('#fb-health-out');
      healthBtn.disabled = true;
      if (out) out.textContent = 'Checking Firestore\u2026';
      try {
        const res = await App.adapter.checkHealth();
        if (out) out.textContent = '\u2713 Cloud OK (' + res.latencyMs + 'ms) \u2022 ' + res.publishedCount + '/' + res.totalCount + ' live projects \u2022 Media: ' + res.uploadChannel;
      } catch (err) {
        if (out) out.textContent = 'Check failed: ' + (err && err.message ? err.message : err);
      } finally {
        healthBtn.disabled = false;
      }
    });
  }
  const swBtn = $('#fb-switch');
  if (swBtn) swBtn.addEventListener('click', async () => {
    try {
      ADMIN.user = await App.adapter.signInAdmin();
      renderAdmin();
    } catch (err) { toast('Account switch failed: ' + (err && err.message ? err.message : 'Cancelled')); }
  });
  const soBtn = $('#fb-signout');
  if (soBtn) soBtn.addEventListener('click', async () => {
    await App.adapter.signOutAdmin();
    ADMIN.user = null;
    renderAdmin();
  });
  $('#bk-export').addEventListener('click', async () => {
    const list = ADMIN.list.length ? ADMIN.list : await App.adapter.getProjects(true);
    const data = { version: 2, exported_at: new Date().toISOString(), mode: App.adapter.name, cms: App.cms, projects: list };
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ab-visuals-backup.json'; a.click();
    toast('Backup exported');
  });
  $('#bk-import').addEventListener('click', () => $('#bk-file').click());
  $('#bk-file').addEventListener('change', async (e2) => {
    const f = e2.target.files[0];
    if (!f) return;
    const ok = await askConfirm('Importing replaces ALL current projects and site text in Firebase. Continue?', 'Import Backup');
    if (!ok) { e2.target.value = ''; return; }
    try {
      const data = JSON.parse(await f.text());
      if (!data.cms || !Array.isArray(data.projects)) throw new Error('Invalid backup file');
      await App.adapter.saveSite(data.cms);
      const old = await App.adapter.getProjects(true);
      for (const o of old) await App.adapter.deleteProject(o.id);
      const list = data.projects.map((p, k) => Object.assign({}, p, { sort_order: p.sort_order != null ? p.sort_order : k }));
      for (const p of list) await App.adapter.saveProject(p);
      toast('Backup imported to Firebase \u2014 reloading\u2026');
      setTimeout(() => location.reload(), 900);
    } catch (err) { toast('Import failed: ' + err.message); }
  });
  $('#bk-demo').addEventListener('click', async () => {
    const ok = await askConfirm('Replace ALL current projects with the 6 AB VISUALS demo projects? Photos and videos of current projects will be lost.', 'Restore Demo');
    if (!ok) return;
    try {
      const old = await App.adapter.getProjects(true);
      for (const o of old) await App.adapter.deleteProject(o.id);
      const seeds = seedProjects();
      for (const p of seeds) await App.adapter.saveProject(p);
      toast('Demo projects restored to Firebase \u2014 reloading\u2026');
      setTimeout(() => location.reload(), 900);
    } catch (err) { toast('Restore failed: ' + err.message); }
  });
  $('#bk-reset').addEventListener('click', async () => {
    const ok = await askConfirm('Reset ALL website text & visual overrides to AB VISUALS defaults? Projects and photos are kept.', 'Reset Text');
    if (!ok) return;
    App.cms = deepMerge(DEFAULT_SITE, {});
    try { await App.adapter.saveSite(App.cms); applyCms(); toast('Text & visuals reset to defaults live'); }
    catch (err) { toast('Reset failed: ' + err.message); }
  });
}
/* ================= router & boot ================= */
const ADMIN_PATH_RE = /\/amit231106(?:\.html)?\/?$/i;
function route() {
  const h = (location.hash || '').replace(/^#/, '').replace(/\/+$/, '').toLowerCase();
  const qs = new URLSearchParams(location.search || '');
  const wasAdmin = App.isAdminRoute;
  App.isAdminRoute =
    h === '/amit231106' ||
    h === 'amit231106' ||
    qs.get('admin') === 'amit231106' ||
    ADMIN_PATH_RE.test(location.pathname || '') ||
    window.AB_FORCE_ADMIN === true;
  if (App.isAdminRoute) {
    if (!wasAdmin) { try { stopPreview(); } catch (e) {} }
    $('#site').classList.add('hidden');
    renderAdmin();
  } else {
    hideAdmin();
    $('#site').classList.remove('hidden');
    if (wasAdmin) {
      /* returning from admin: refresh data edited there */
      reloadPublished().then(() => { if (App.mode === 'case') mountPreview(App.projects[App.idx]); });
      App.adapter.getSite().then((s) => { App.cms = deepMerge(DEFAULT_SITE, s || {}); applyCms(); }).catch(() => {});
    }
    pose(App.mode);
  }
}
function openAdmin() {
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    try { history.pushState(null, '', '/amit231106'); route(); return; } catch (e) {}
  }
  location.hash = '/amit231106';
}
function goSite() {
  window.AB_FORCE_ADMIN = false; /* exit the admin-entry page for good */
  if (ADMIN_PATH_RE.test(location.pathname || '') && (location.protocol === 'http:' || location.protocol === 'https:')) {
    try { history.pushState(null, '', '/'); route(); return; } catch (e) {}
  }
  if (location.hash) location.hash = '';
  else route();
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
/* cross-tab live sync (cloud config or passcode changed in another tab) */
window.addEventListener('storage', (e) => {
  if (e.key === 'abv.sbCfg' || e.key === 'abv.pass') location.reload();
});
/* ---------- boot ---------- */
(async function boot() {
  setN();
  applyAssets();
  pose('hero');
  bindSceneEvents();
  window.addEventListener('resize', onResize);

  /* Render immediately at t=0ms so all original hero & entrance animations run with zero delay */
  App.cms = deepMerge(DEFAULT_SITE, {});
  App.projects = seedProjects();
  applyCms();
  refreshCaseUI();
  route();
  entrance();

  /* Connect Firebase Cloud in the background and seamlessly sync live data */
  try {
    App.adapter = await makeAdapter();
  } catch (err) {
    console.error(err);
    App.adapter = LocalAdapter;
    try { await LocalAdapter.init(); } catch (e2) {}
  }
  try {
    const [siteData, all] = await Promise.all([
      App.adapter.getSite().catch(() => null),
      App.adapter.getProjects(false).catch(() => [])
    ]);
    if (siteData) {
      App.cms = deepMerge(DEFAULT_SITE, siteData);
      applyCms();
    }
    const pub = (all || []).filter((p) => p.is_published !== false);
    if (pub.length) {
      App.projects = pub;
      if (App.idx >= App.projects.length) App.idx = Math.max(0, App.projects.length - 1);
      refreshCaseUI();
      if (App.mode === 'case' && !App.isAdminRoute) mountPreview(App.projects[App.idx]);
    } else if (siteData) {
      App.projects = [];
      refreshCaseUI();
    }
  } catch (err) {
    console.warn('Cloud sync deferred to defaults:', err);
  }
  if (App.isAdminRoute) {
    renderAdmin();
  }
  /* Firebase live sync: edits made in Admin Panel appear on every open device instantly */
  if (App.adapter && App.adapter.name === 'firebase' && App.adapter.realtime) {
    App.adapter.realtime(async (what) => {
      try {
        if (what === 'projects') {
          await reloadPublished();
          if (App.isAdminRoute && isAuthed() && ADMIN.tab === 'projects' && !ADMIN.editing) {
            await reloadAdminList(); renderStats(); renderProjectList();
          }
        } else {
          const s2 = await App.adapter.getSite();
          App.cms = deepMerge(DEFAULT_SITE, s2 || {});
          applyCms();
        }
        if (!App.isAdminRoute) toast('Live update received');
      } catch (e) {}
    });
  }
  if (App.adapter && App.adapter.name === 'firebase' && typeof App.adapter.onAdminAuthChange === 'function') {
    App.adapter.onAdminAuthChange((userState) => {
      const prevUid = ADMIN.user ? ADMIN.user.uid : null;
      const nextUid = userState ? userState.uid : null;
      ADMIN.user = userState;
      if (App.isAdminRoute && prevUid !== nextUid) {
        renderAdmin();
      }
    });
  }
})();
</script>
